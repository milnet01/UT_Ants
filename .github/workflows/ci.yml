# The pipeline runs scripts/ci.sh and duplicates none of its steps.
#
# Every check is one line, deliberately: the checks live in the script so the
# run here and the run on a developer's machine cannot drift (local-gate.md
# § 3). Provisioning a compiler IS the runner's job and is not a check, which
# is why the apt lines are not a duplicated step -- and keeping ccache's
# directory between runs is provisioning too (UTA-0097). The line after the
# gate prints the cache's hit rate and checks nothing.
#
# Linux and Windows are both first-class (docs/design.md § The stack), so a
# change that breaks either breaks the build. Windows uses MSVC through the
# Visual Studio generator; the script picks that by itself.
name: CI

on:
  push:
    branches: [main]
    # A release is a tag, and docs/design.md says every release is built and
    # tested on both platforms. Without this that sentence is false.
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      # UTA-0077. The real-asset tier needs an Unreal Tournament install and
      # this runner has none, so it cannot run here -- but it can BUILD the
      # binary for a machine that does. UTA_UT_INSTALL_DIR is a compile-time
      # define (tests/CMakeLists.txt), so the path has to be baked in at build
      # time and cannot be chosen when the binary runs. Hence an input.
      #
      # Empty, the default, means no artifact and a run identical to a push.
      ut_install_dir:
        description: >-
          Bake this install path into a Windows real-asset test binary and
          upload it as an artifact (e.g. C:\UnrealTournament). Empty = skip.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Three compilers, because the design's floor names three. Clang
          # gets g++-14 alongside it for libstdc++, not as its compiler.
          - name: Linux (GCC 14)
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            apt: g++-14
          - name: Linux (Clang 19)
            os: ubuntu-24.04
            cc: clang-19
            cxx: clang++-19
            # libclang-rt-19-dev is the ThreadSanitizer runtime. It is a
            # RECOMMENDED dependency of clang-19, and this job installs with
            # --no-install-recommends, so without naming it the race-detector
            # step fails to link: "cannot find libclang_rt.tsan.a".
            apt: clang-19 g++-14 libclang-rt-19-dev
          - name: Windows (MSVC)
            os: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The quarantine guard reads the index, and the link check reads
          # every tracked markdown file. A shallow checkout is enough for both;
          # neither walks history.
          fetch-depth: 1

      - name: Install the Linux toolchain
        if: runner.os == 'Linux'
        env:
          # Through the environment rather than interpolated into the script:
          # a ${{ }} expansion inside run: is expanded before the shell sees
          # it, so it is the shape template-injection warnings are about.
          APT_PACKAGES: ${{ matrix.apt }}
          CC_NAME: ${{ matrix.cc }}
          CXX_NAME: ${{ matrix.cxx }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086  # the package list is deliberately split
          sudo apt-get install --no-install-recommends -y \
            $APT_PACKAGES ninja-build shellcheck yamllint ccache
          # The root CMakeLists.txt uses ccache whenever it is installed. Untold,
          # ccache hashes the build path into every key and mostly misses, so
          # the base-directory and hash-dir settings are what make it pay --
          # the same two CLAUDE.md sets locally.
          {
            echo "CC=$CC_NAME"
            echo "CXX=$CXX_NAME"
            echo "CCACHE_DIR=$HOME/.cache/ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_NOHASHDIR=true"
            echo "CCACHE_MAXSIZE=1G"
          } >> "$GITHUB_ENV"

      # Catch2 is most of the objects in both Linux trees, the Release one and
      # the ThreadSanitizer one, and it never changes. Kept per compiler.
      # ccache keys on source and flags itself, so an out-of-date restore costs
      # misses and never a wrong object -- the numeric contract's flags are
      # part of that key. A pull request's cache is scoped to its own ref, so
      # it cannot be restored by a run on main or on a release tag.
      - name: Keep the compiler cache between runs
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.cxx }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.cxx }}-

      - name: Run the gate
        shell: bash
        run: ./scripts/ci.sh

      - name: Show the compiler cache's hit rate
        if: always() && runner.os == 'Linux'
        run: ccache --show-stats

      # UTA-0077. Built AFTER the gate and never as part of it: this binary is
      # not run here, so it proves nothing about this commit and must not be
      # able to turn the gate red for a machine that is not this one.
      - name: Build the real-asset tests for a machine that has an install
        if: >-
          runner.os == 'Windows' && github.event_name == 'workflow_dispatch'
          && inputs.ut_install_dir != ''
        shell: bash
        env:
          # Through the environment, not interpolated into run: -- the same
          # reason the Linux toolchain step gives.
          UT_INSTALL_DIR: ${{ inputs.ut_install_dir }}
        run: |
          cmake -S . -B build-real -DCMAKE_BUILD_TYPE=Release \
            -DUTA_BUILD_TOOLS=OFF -DUTA_REAL_ASSET_TESTS=ON \
            -DUTA_UT_INSTALL_DIR="$UT_INSTALL_DIR"
          cmake --build build-real --config Release --target uta_real_asset_tests

      - name: Upload it
        if: >-
          runner.os == 'Windows' && github.event_name == 'workflow_dispatch'
          && inputs.ut_install_dir != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: real-asset-tests-msvc
          # The Visual Studio generator is multi-config, so the executable
          # lands under a per-configuration directory. Matched rather than
          # named, so a generator change does not silently upload nothing.
          path: build-real/tests/**/uta_real_asset_tests.exe
          if-no-files-found: error
